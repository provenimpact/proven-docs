name: Render Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

  render-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install proven-docs globally
        run: npm install -g .

      - name: Render basic example
        run: proven-docs render examples/basic.adoc --output examples/output/basic.pdf

      - name: Render classified example
        run: proven-docs render examples/classified-report.adoc --template classified --output examples/output/classified-report.pdf

      - name: Render architecture doc
        run: proven-docs render docs/architecture.adoc --output examples/output/architecture.pdf

      - name: Upload example PDFs
        uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: examples/output/
