name: Render Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Render architecture.adoc to PDF
        run: node bin/proven-docs.js render docs/architecture.adoc

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: architecture-pdf
          path: docs/architecture.pdf

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test
